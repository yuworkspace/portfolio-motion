<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archery UI - Techwear Vibe</title>
  
  <style>
    /* 기본 세팅 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* 컨테이너 */
    .container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* ===================== */
    /* 그리드 */
    /* ===================== */
    .grid-line {
      position: absolute;
      background: rgba(255,255,255,0.05);
    }

    .grid-line.horizontal {
      top: 50%;
      width: 100%;
      height: 1px;
    }

    .grid-line.vertical {
      left: 50%;
      height: 100%;
      width: 1px;
    }

    /* ===================== */
    /* 타겟 */
    /* ===================== */
    .target {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 320px;
      height: 320px;
      transform: translate(-50%, -50%);
      border-radius: 50%;

      border: 1px solid rgba(255,255,255,0.15);

      box-shadow:
        0 0 60px rgba(77,163,255,0.12),
        inset 0 0 30px rgba(255,255,255,0.05);
    }

    /* 중심점 */
    .target::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;

      width: 6px;
      height: 6px;

      transform: translate(-50%, -50%);
      background: #4da3ff;

      border-radius: 50%;

      box-shadow:
        0 0 10px #4da3ff,
        0 0 20px #4da3ff,
        0 0 40px #4da3ff;
    }

    /* ===================== */
    /* 빛 포인트 */
    /* ===================== */
    .light {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #4da3ff;

      box-shadow:
        0 0 6px #4da3ff,
        0 0 12px #4da3ff,
        0 0 20px #4da3ff;
    }

    /* ===================== */
    /* 텍스트 */
    /* ===================== */
    .content {
      position: absolute;
      top: 20%;
      left: 10%;
    }

    /* 메탈 텍스트 핵심 */
    .metal-text {
      font-size: 72px;
      font-weight: 600;
      letter-spacing: 0.12em;

      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #dcdcdc 20%,
        #9a9a9a 40%,
        #ffffff 60%,
        #cfcfcf 80%,
        #ffffff 100%
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-shadow:
        0 0 10px rgba(255,255,255,0.15),
        0 0 2px rgba(255,255,255,0.3);
    }

    .subtitle {
      margin-top: 12px;
      font-size: 14px;
      letter-spacing: 0.2em;
      color: #9a9a9a;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 배경 그리드 -->
    <div class="grid">
      <div class="grid-line horizontal"></div>
      <div class="grid-line vertical"></div>
    </div>

    <!-- 중앙 타겟 -->
    <div class="target"></div>

    <!-- 포인트 라이트 -->
    <div class="light" style="top:30%; left:60%;"></div>
    <div class="light" style="top:70%; left:40%;"></div>

    <!-- 텍스트 -->
    <div class="content">
      <h1 class="title metal-text">ARCHERY</h1>
      <p class="subtitle">PRECISION / FOCUS / CONTROL</p>
    </div>

  </div>

</body>
</html>
