<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visual Works & Archive by YU. 모션 그래픽, 일러스트 및 시각 디자인 작업물 기록.">
    <title>YU'S WORKSPACE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Roboto+Mono:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 1. 세련된 진회색 배경으로 변경 (그리드가 더 잘 보임) */
            background-color: #141416; 
            color: #e0e0e0;
            font-family: 'Roboto Mono', monospace;
            min-height: 100vh;
            overflow: hidden;
            
            /* 그리드 선 투명도를 미세하게 올려 배경과 조화롭게 설정 */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center center;
        }

        .container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- 상단 영역 --- */
        header {
            position: relative; /* 중앙 정렬을 위한 기준점 설정 */
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            color: #888;
        }

        .nav-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .nav-btn:hover {
            border-color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        /* 2. 중앙 정렬 완벽 해결 (절대 위치 사용) */
        .system-status { 
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 15px; /* 버튼과의 시각적 높이 조절 */
            text-align: center; 
        }

        .coordinates { text-align: right; line-height: 1.6; }

        /* --- 하단 영역 --- */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .main-text {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 3. 타이틀 크기 축소 및 자간 확장으로 세련미 극대화 */
        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.1rem; /* 크기 줄임 */
            font-weight: 800;
            letter-spacing: 6px; /* 자간 대폭 늘림 */
            color: #fff;
            text-transform: uppercase;
            transition: text-shadow 0.3s ease;
            cursor: default;
        }

        .main-title:hover {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }

        .sub-title {
            font-size: 0.95rem;
            letter-spacing: 5px;
            color: #aaa;
        }

        .sub-title::before {
            content: "";
            display: inline-block;
            width: 35px;
            height: 1px;
            background-color: #aaa;
            margin-right: 18px;
            vertical-align: middle;
        }

        .footer-logs {
            text-align: right;
            font-size: 0.8rem;
            color: #777;
            line-height: 1.8;
            letter-spacing: 1.5px;
        }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            body { overflow: auto; }
            .container { padding: 25px; }
            .system-status, .coordinates { display: none; }
            header { justify-content: flex-start; }
            footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 40px;
            }
            .main-title {
                font-size: 1.5rem;
                letter-spacing: 3px;
                word-break: keep-all;
            }
            .sub-title { font-size: 0.75rem; letter-spacing: 3px; }
            .footer-logs { text-align: left; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <header>
            <a href="archive.html" class="nav-btn" aria-label="프로젝트 아카이브로 이동" title="Enter Workspace">&gt;&gt;</a>
            
            <div class="system-status">
                [ SYSTEM : ONLINE ]
            </div>
            
            <div class="coordinates">
                COORD: 37.5665° N / 126.9780° E<br>
                WIND: 4.20 m/s DIR 280.0°
            </div>
        </header>

        <footer>
            <div class="main-text">
                <h1 class="main-title">WELCOME, YU'S WORKSPACE</h1>
                <p class="sub-title">VISUAL WORKS & ARCHIVE</p>
            </div>
            
            <div class="footer-logs">
                [ MULTIDISCIPLINARY LOGS ]<br>
                VER_1.0.0 // 2026
            </div>
        </footer>

    </div>
</body>
</html>
